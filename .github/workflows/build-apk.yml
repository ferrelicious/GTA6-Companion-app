name: Build & Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies & build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_WEB_PUSH_PUBLIC_KEY: ${{ secrets.VITE_WEB_PUSH_PUBLIC_KEY }}
          VITE_GITHUB_REPO: ${{ github.repository }}
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          npm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Capacitor Android
        run: |
          rm -f capacitor.config.ts capacitor.config.js capacitor.config.json
          node -e 'fs.writeFileSync("capacitor.config.json", JSON.stringify({ appId: "com.ferrelicious.gta6companion", appName: "GTA6 Companion", webDir: "dist" }, null, 2))'
          rm -rf android
          npx cap add android
          npx cap sync android
          chmod +x android/gradlew

      - name: Fix Kotlin & set version
        run: |
          node -e '
            const fs = require("fs");
            const fix = "\nsubprojects { configurations.all { resolutionStrategy { force \"org.jetbrains.kotlin:kotlin-stdlib:1.8.22\", \"org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22\", \"org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22\" } } }\n";
            fs.appendFileSync("android/build.gradle", fix);
          '
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/g" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/g" android/app/build.gradle

      - name: Build Installable APK
        run: |
          cd android
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../GTA6-Companion-v1.0.${{ github.run_number }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: GTA 6 Companion v1.0.${{ github.run_number }}
          body: Automatiskt byggd APK från commit `${{ github.sha }}`.
          files: GTA6-Companion-v1.0.${{ github.run_number }}.apk