name: Build & Sign Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Signed Capacitor APK
    runs-on: ubuntu-latest

    env:
      APP_VERSION_NAME: 1.0.${{ github.run_number }}
      APP_VERSION_TAG: v1.0.${{ github.run_number }}
      ANDROID_VERSION_CODE: ${{ github.run_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies & build web bundle
        env:
          VITE_APP_VERSION: ${{ env.APP_VERSION_NAME }}
        run: |
          npm install
          npm run build

      - name: Prepare & Version Capacitor Android project
        run: |
          if [ ! -f "capacitor.config.ts" ] && [ ! -f "capacitor.config.json" ]; then
            cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.leonida.companion",
            "appName": "Leonida Companion",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          EOF
          fi

          if [ ! -d "android" ]; then
            npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
            npx cap add android
          fi

          npx cap sync android

          if [ -f "android/app/build.gradle" ]; then
            sed -i -E "s/versionCode [0-9]+/versionCode ${ANDROID_VERSION_CODE}/g" android/app/build.gradle
            sed -i -E "s/versionName \"[^\"]+\"/versionName \"${APP_VERSION_NAME}\"/g" android/app/build.gradle
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i -E "s/versionCode = [0-9]+/versionCode = ${ANDROID_VERSION_CODE}/g" android/app/build.gradle.kts
            sed -i -E "s/versionName = \"[^\"]+\"/versionName = \"${APP_VERSION_NAME}\"/g" android/app/build.gradle.kts
          fi

      - name: Decode Release Keystore from GitHub Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      - name: Build unsigned release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Align & Sign Release APK with fixed Keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME/build-tools"/* | sort -V | tail -n 1)
          UNSIGNED_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$UNSIGNED_APK" ]; then
            UNSIGNED_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          fi
          ALIGNED_APK="android/app/build/outputs/apk/release/app-release-aligned.apk"
          SIGNED_APK="leonida-companion-${APP_VERSION_TAG}.apk"

          "$BUILD_TOOLS_DIR/zipalign" -v -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks android/app/release.keystore \
            --ks-pass "env:KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "env:KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$SIGNED_APK"
          rm -f android/app/release.keystore

      - name: Publish Signed APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: Leonida Companion ${{ env.APP_VERSION_TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: leonida-companion-${{ env.APP_VERSION_TAG }}.apk
