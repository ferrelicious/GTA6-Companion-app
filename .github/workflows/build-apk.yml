name: Build & Sign Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Capacitor Android APK
    runs-on: ubuntu-latest

    env:
      APP_VERSION: 1.0.${{ github.run_number }}
      RELEASE_TAG: v1.0.${{ github.run_number }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & build web app
        env:
          VITE_APP_VERSION: ${{ env.APP_VERSION }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_WEB_PUSH_PUBLIC_KEY: ${{ secrets.VITE_WEB_PUSH_PUBLIC_KEY }}
          VITE_GITHUB_REPO: ${{ secrets.VITE_GITHUB_REPO || github.repository }}
        run: |
          npm install
          npm run build

      - name: Setup & sync Capacitor Android
        run: |
          node -e '
            const fs = require("fs");
            if (!fs.existsSync("capacitor.config.ts") && !fs.existsSync("capacitor.config.json")) {
              fs.writeFileSync("capacitor.config.json", JSON.stringify({
                appId: "com.leonida.companion",
                appName: "Leonida Companion",
                webDir: "dist"
              }, null, 2));
            }
          '
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          node -e '
            const fs = require("fs");
            const code = process.env.GITHUB_RUN_NUMBER || "1";
            const name = process.env.APP_VERSION || ("1.0." + code);
            for (const file of ["android/app/build.gradle", "android/app/build.gradle.kts"]) {
              if (!fs.existsSync(file)) continue;
              let txt = fs.readFileSync(file, "utf8");
              txt = txt.replace(/versionCode\s*=?\s*\d+/, (m) => m.includes("=") ? `versionCode = ${code}` : `versionCode ${code}`);
              txt = txt.replace(/versionName\s*=?\s*"[^"]+"/, (m) => m.includes("=") ? `versionName = "${name}"` : `versionName "${name}"`);
              fs.writeFileSync(file, txt);
            }
          '
          chmod +x android/gradlew

      - name: Build Android release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Sign APK (or prepare unsigned fallback)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          UNSIGNED_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$UNSIGNED_APK" ] || [ ! -f "$UNSIGNED_APK" ]; then
            echo "ERROR: No release APK produced by Gradle."
            exit 1
          fi

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > android/app/release.keystore
            SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
            BUILD_TOOLS=$(ls -d "$SDK_DIR/build-tools"/* | sort -V | tail -n 1)
            ALIGNED_APK="android/app/build/outputs/apk/release/app-release-aligned.apk"
            OUT_APK="leonida-companion-${RELEASE_TAG}.apk"

            "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
            "$BUILD_TOOLS/apksigner" sign \
              --ks android/app/release.keystore \
              --ks-pass "env:KEYSTORE_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass "env:KEY_PASSWORD" \
              --out "$OUT_APK" \
              "$ALIGNED_APK"
            "$BUILD_TOOLS/apksigner" verify "$OUT_APK"
            rm -f android/app/release.keystore
            echo "Signed APK created: $OUT_APK"
          else
            OUT_APK="leonida-companion-${RELEASE_TAG}-unsigned.apk"
            cp "$UNSIGNED_APK" "$OUT_APK"
            echo "Signing secrets missing; prepared unsigned APK: $OUT_APK"
          fi

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Leonida Companion ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: leonida-companion-*.apk
